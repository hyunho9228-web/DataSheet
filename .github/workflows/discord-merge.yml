name: 디스코드 머지 알림

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    name: 디스코드 공지 전송
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 공지 생성 및 웹훅 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PROJECT_NAME: 데이터시트
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          parsed = urllib.parse.urlsplit(webhook)
          if parsed.scheme != "https" or parsed.hostname != "discord.com" or not parsed.path.startswith("/api/webhooks/"):
              sys.exit("디스코드 웹훅 비밀값이 없거나 올바른 주소가 아닙니다.")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)

          project = os.environ["PROJECT_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              title = f"[{project}] 알림 연결 테스트"
              description = "GitHub와 디스코드 연결이 완료됐습니다. 이후 지정 브랜치에 푸시되면 공지합니다."
              url = f"{server}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              fields = []
          else:
              if event.get("deleted"):
                  sys.exit(0)
              branch = event["ref"].removeprefix("refs/heads/")
              commits = event.get("commits", [])
              title = f"[{project}] {branch} 반영 완료"
              lines = [
                  f"- {commit['id'][:7]} {commit['message'].splitlines()[0][:200]}"
                  for commit in commits[:10]
              ]
              if len(commits) > 10:
                  lines.append(f"외 {len(commits) - 10}건은 변경 내역 링크에서 확인해주세요.")
              description = "\n".join(lines) or "브랜치 변경 내역은 링크에서 확인해주세요."
              url = event.get("compare") or f"{server}/{repository}/commit/{event['after']}"
              fields = [
                  {"name": "반영 브랜치", "value": branch[:1024], "inline": True},
                  {"name": "반영 담당자", "value": os.environ["GITHUB_ACTOR"][:1024], "inline": True},
              ]

          # 공지는 한 건으로 제한하고 전체 호출 알림은 사용하지 않습니다.
          payload = {
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title[:256],
                  "description": description[:3000],
                  "url": url,
                  "color": 5025616,
                  "fields": fields,
                  "footer": {"text": repository[:2048]},
              }],
          }
          query = dict(urllib.parse.parse_qsl(parsed.query))
          query["wait"] = "true"
          endpoint = urllib.parse.urlunsplit(parsed._replace(query=urllib.parse.urlencode(query), fragment=""))
          request = urllib.request.Request(
              endpoint, data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "HumanGhost-Merge-Notifier"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  response.read()
          except urllib.error.HTTPError as error:
              sys.exit(f"디스코드 전송 실패: 응답 코드 {error.code}. 웹훅 설정과 실행 기록을 확인해주세요.")
          except (urllib.error.URLError, TimeoutError):
              sys.exit("디스코드 연결에 실패했습니다. 네트워크 상태를 확인한 뒤 다시 실행해주세요.")
          print("디스코드 공지를 전송했습니다.")

